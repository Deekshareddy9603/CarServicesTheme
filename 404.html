<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly Detailing Studio</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* Full Screen Background Stage */
        .page-404-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-image-stage {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .bg-image-stage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(0.6) contrast(1.2) saturate(1.1);
        }

        /* Glass Gradient & Ambient Vignette */
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.92) 85%),
                        linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.95) 100%);
            z-index: 2;
        }

        /* Ambient Glowing Pulse Center */
        .glow-orb {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.2) 0%, rgba(0, 102, 255, 0.05) 60%, transparent 75%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            filter: blur(50px);
            animation: orbPulse 4s ease-in-out infinite alternate;
        }

        @keyframes orbPulse {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* 404 Glassmorphic Container */
        .card-404-container {
            position: relative;
            z-index: 3;
            max-width: 650px;
            width: 90%;
            background: rgba(10, 13, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 32px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 0 0 40px rgba(0, 240, 255, 0.15);
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -4px;
            background: linear-gradient(135deg, #00f0ff 0%, #0066ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
        }

        .error-tag {
            color: #00f0ff;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 16px;
            display: inline-block;
        }

        .error-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .error-desc {
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.6;
            max-width: 480px;
            margin: 0 auto 36px;
        }

        /* Actions Button Row */
        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #00f0ff 0%, #0066ff 100%);
            color: #000000;
            font-size: 1rem;
            font-weight: 800;
            padding: 16px 36px;
            border-radius: 16px;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 12px 30px rgba(0, 240, 255, 0.35);
        }

        .home-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 18px 40px rgba(0, 240, 255, 0.6);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 800;
            padding: 16px 32px;
            border-radius: 16px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            border-color: #00f0ff;
            color: #00f0ff;
            transform: translateY(-3px);
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .error-code {
                font-size: 6rem;
            }
            .error-title {
                font-size: 1.75rem;
            }
            .card-404-container {
                padding: 40px 24px;
            }
            .home-btn, .back-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="page-404-wrapper">
        <!-- Background Ultra HD Image Stage -->
        <div class="bg-image-stage">
            <img src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=2560&q=100" alt="Stackly Detailing Studio Salem">
            <div class="bg-overlay"></div>
        </div>

        <div class="glow-orb"></div>

        <!-- Glassmorphic Card Container -->
        <div class="card-404-container">
            <span class="error-tag">Route Off Track</span>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Detoured into the Studio</h1>
            <p class="error-desc">The page or service component you are searching for has been moved, removed, or is currently undergoing high-gloss ceramic curing.</p>
            
            <div class="error-actions">
                <a href="index.html" class="home-btn">
                    <i class="fa-solid fa-house"></i>
                    <span>Return to home page</span>
                </a>
                <button onclick="history.back()" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Go Back</span>
                </button>
            </div>
        </div>
    </div>

</body>
</html>
